version: 1
repo_root: careconnect
public_boundary: true
services:
  - service_id: careconnect-web
    inventory_repo: careconnect
    runtime: docker
    ingress: host-caddy
    canonical_host: careconnect.ing
    public_hosts:
      - careconnect.ing
    private_bind: 127.0.0.1:3300
    container_name: careconnect-web
    systemd_unit: null
    env_file: /etc/projects-merge/env/careconnect-web.env
    release_root: /srv/apps/careconnect-web/releases
    health:
      public:
        url: https://careconnect.ing/api/v1/health
        kind: json
        expect_status:
          - 200
        expect_json_status:
          - healthy
          - degraded
      private: null
    boundary_entrypoints:
      - README.md
      - AGENTS.md
      - docs/README.md

notes:
  - Shared VPS documentation ownership is defined in /home/jer/repos/vps/platform-ops/docs/standards/PLAT-009-shared-vps-documentation-boundary.md.
  - This manifest is the repo-local runtime contract and intentionally mirrors the live platform-ops inventory fields checked by CI.
  - Public prose documentation intentionally omits production host paths, release commands, and shared-host operational procedures.
