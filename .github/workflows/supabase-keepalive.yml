name: Supabase Keepalive

on:
  schedule:
    # Supabase evaluates Free projects over a 7-day activity window. Run daily
    # so delayed scheduled jobs still leave a wide safety margin.
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi

      - name: Query the Supabase Data API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          endpoint="${SUPABASE_URL%/}/rest/v1/services_public?select=id&limit=1"
          echo "Running three minimal Data API queries against the services_public view."

          for attempt in 1 2 3; do
            http_code="$(curl --silent --show-error \
              --output "/tmp/supabase-keepalive-${attempt}.json" \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" \
              -H "Cache-Control: no-cache" \
              "${endpoint}")"

            if [ "${http_code}" -ne 200 ]; then
              echo "::error::Supabase Data API keepalive query ${attempt} failed with HTTP ${http_code}."
              exit 1
            fi
          done

          echo "Supabase Data API keepalive succeeded (3/3 queries)."
