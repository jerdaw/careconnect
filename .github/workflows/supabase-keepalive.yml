name: Supabase Keepalive

on:
  schedule:
    # Supabase evaluates Free projects over a 7-day activity window. Run daily
    # so delayed scheduled jobs still leave a wide safety margin.
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      CARECONNECT_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CARECONNECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      VISITBRIEF_SUPABASE_URL: ${{ secrets.VISITBRIEF_SUPABASE_URL }}
      VISITBRIEF_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VISITBRIEF_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Validate required secrets
        id: validate
        run: |
          set -euo pipefail

          missing=0
          for variable in \
            CARECONNECT_SUPABASE_URL \
            CARECONNECT_SUPABASE_PUBLISHABLE_KEY \
            VISITBRIEF_SUPABASE_URL \
            VISITBRIEF_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing required repository secret for ${variable}."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Query every Supabase Data API
        id: data-api
        continue-on-error: true
        run: |
          set -euo pipefail

          query_project() {
            local project_name="$1"
            local project_url="$2"
            local publishable_key="$3"
            local resource="$4"
            local endpoint="${project_url%/}/rest/v1/${resource}?select=id&limit=1"

            echo "Running three minimal Data API queries for ${project_name}."

            for attempt in 1 2 3; do
              http_code="$(curl --silent --show-error \
                --output "/tmp/${project_name}-supabase-keepalive-${attempt}.json" \
                --write-out "%{http_code}" \
                --connect-timeout 10 \
                --max-time 30 \
                -H "apikey: ${publishable_key}" \
                -H "Authorization: Bearer ${publishable_key}" \
                -H "Accept: application/json" \
                -H "Cache-Control: no-cache" \
                "${endpoint}")"

              if [ "${http_code}" -ne 200 ]; then
                echo "::error::${project_name} Data API query ${attempt} failed with HTTP ${http_code}."
                return 1
              fi
            done

            echo "${project_name} Data API keepalive succeeded (3/3 queries)."
          }

          query_project \
            "careconnect" \
            "${CARECONNECT_SUPABASE_URL}" \
            "${CARECONNECT_SUPABASE_PUBLISHABLE_KEY}" \
            "services_public"
          query_project \
            "visitbrief" \
            "${VISITBRIEF_SUPABASE_URL}" \
            "${VISITBRIEF_SUPABASE_PUBLISHABLE_KEY}" \
            "profiles"

      - name: Sync persistent keepalive failure issue
        if: always()
        env:
          FAILURE_DETECTED: ${{ steps.validate.outcome != 'success' || steps.data-api.outcome != 'success' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="Supabase Keepalive Failure"
          issue_number="$(
            gh issue list \
              --state open \
              --limit 100 \
              --json number,title \
              --jq 'map(select(.title == "Supabase Keepalive Failure")) | first | .number // empty'
          )"

          if [ "${FAILURE_DETECTED}" != "true" ]; then
            if [ -n "${issue_number}" ]; then
              gh issue close "${issue_number}" \
                --comment "Resolved by a successful database keepalive run: ${RUN_URL}"
            fi
            exit 0
          fi

          body="$(
            printf '%s\n' \
              "The daily Supabase database keepalive failed." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "Required response:" \
              "1. Inspect the run log to identify the affected project." \
              "2. Confirm the project state in Supabase." \
              "3. Resume the project if it is paused." \
              "4. Rerun this workflow and confirm all database queries succeed." \
              "" \
              "This issue is updated in place and closes automatically after a successful run."
          )"

          if [ -n "${issue_number}" ]; then
            gh issue edit "${issue_number}" --body "${body}"
          else
            gh issue create \
              --title "${title}" \
              --label "automated" \
              --body "${body}"
          fi

      - name: Fail after reporting a Data API error
        if: steps.data-api.outcome == 'failure'
        run: exit 1
